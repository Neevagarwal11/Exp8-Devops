
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experiment-8-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: experiment-8
      version: blue
  template:
    metadata:
      labels:
        app: experiment-8
        version: blue
    spec:
      containers:
        - name: healthcare-app
          image: experiment-8-app:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "BLUE - Version 1"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
